<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer SPA</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f8f9fa;
            --border-color: #dee2e6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
        }

        header {
            background-color: #343a40;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background-color: white;
            border-bottom: 1px solid var(--border-color);
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
        }

            button:hover {
                opacity: 0.9;
            }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            min-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .form-group {
            margin-bottom: 1rem;
        }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
            }

            .form-group input {
                width: 100%;
                padding: 0.5rem;
                box-sizing: border-box;
            }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Футбольна ліга</h1>
    </header>

    <nav>
        <button onclick="app.navigateTo('teams')">Команди</button>
        <button onclick="app.navigateTo('players')">Гравці</button>
    </nav>

    <main id="app-content">
        <!-- Контент буде завантажуватись сюди динамічно -->
    </main>

    <script src="app.js"></script>
</body>
</html>
